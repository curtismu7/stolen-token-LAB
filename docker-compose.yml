# OrbStack:  HOST_PORT=4950 docker compose up --build -d   ->  http://127.0.0.1:4950
# The server binds 0.0.0.0 INSIDE the container (STLAB_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 4950-4999.
name: stolen-token-lab

services:
  stolen-token-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-4950}:4950"
    environment:
      PORT: "4950"
      STLAB_BIND: 0.0.0.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4950/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
